name: Release package

on:
  push:
    tags: ['design-v*']

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/design
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify tag and package version
        run: test "${GITHUB_REF_NAME#design-v}" = "$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Normalize and hash artifact
        id: identity
        run: |
          archive="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sarj-design-*.tgz' -print -quit)"
          test -n "$archive"
          mv "$archive" "$RUNNER_TEMP/package.tgz"
          node tests/package-surface.mjs "$RUNNER_TEMP/package.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-design
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-design-release
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-design
          path: ${{ runner.temp }}
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Verify artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/package.tgz" | sha256sum --check --strict
      - name: Publish or verify an existing immutable version
        run: |
          version="${GITHUB_REF_NAME#design-v}"
          if registry_url="$(npm view "@sarj/design@$version" dist.tarball 2>/dev/null)"; then
            curl --fail --silent --show-error --location "$registry_url" --output "$RUNNER_TEMP/registry-package.tgz"
            mkdir "$RUNNER_TEMP/built-package" "$RUNNER_TEMP/registry-package"
            tar --extract --gzip --file "$RUNNER_TEMP/package.tgz" --directory "$RUNNER_TEMP/built-package"
            tar --extract --gzip --file "$RUNNER_TEMP/registry-package.tgz" --directory "$RUNNER_TEMP/registry-package"
            diff --recursive --no-dereference "$RUNNER_TEMP/built-package" "$RUNNER_TEMP/registry-package"
          else
            npm publish "$RUNNER_TEMP/package.tgz" --access public --provenance --ignore-scripts
          fi
