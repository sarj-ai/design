name: Deploy reference site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ui-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/docs-ui
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/docs-ui/package-lock.json
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm run build
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-ui-site
          path: apps/docs-ui/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-ui-production
      url: https://docs-ui.sarj.ai
    defaults:
      run:
        working-directory: apps/docs-ui
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/docs-ui/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-ui-site
          path: apps/docs-ui/dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Purge the production hostname cache
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-urlencode 'name=sarj.ai' \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            'https://api.cloudflare.com/client/v4/zones')"
          zone_id="$(jq --exit-status --raw-output '.result | select(length == 1) | .[0].id' <<< "$zone_response")"
          purge_response="$(jq --null-input '{hosts: ["docs-ui.sarj.ai"]}' | curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @- \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache")"
          jq --exit-status '.success == true' <<< "$purge_response" >/dev/null
      - run: npm run verify:deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
