# Push to main -> live on Cloudflare Workers.
#
# Needs two repository secrets, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Workers & Pages -> Account ID
#
# Everything else — the worker name, the bindings, the compat flags — is in
# wrangler.jsonc, so a deploy never depends on dashboard state someone has to
# remember to keep in step.
name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A newer push supersedes one still building; never let two deploys race.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Before the build, not after: a missing credential should cost ten
      # seconds, not the two minutes it takes to get to the Deploy step. A
      # secret can exist and still hold an empty string, and wrangler's
      # "token not set" error reads identically either way.
      - name: Check the Cloudflare credentials are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$TOKEN" ]   || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          # Lengths only, never the values. A real token is 40 characters and an
          # account id is 32 hex, so this distinguishes "wrong thing pasted"
          # from "wrong scope" without putting a secret in the log.
          echo "token: ${#TOKEN} chars, account: ${#ACCOUNT} chars"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates that guard a local commit, so a red build never ships.
      - run: npm run lint
      - run: npm run typecheck

      - name: Build for Workers
        run: npm run cf:build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        # The `with:` inputs above are not enough. The action detects OpenNext
        # and calls `opennextjs-cloudflare deploy`, which spawns wrangler as a
        # nested subprocess -- and that subprocess reads the environment, not
        # the action's inputs. Without these two, wrangler falls back to
        # interactive OAuth and dies with "necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable".
        # cloudflare/wrangler-action#246, opennextjs/opennextjs-cloudflare#910.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare Access sits in front of design.sarj.ai and answers at the
      # edge, before the Worker runs. So a probe from here cannot prove the app
      # is healthy -- Access redirects identically whether the Worker serves
      # pages or throws on every request. Checking for a 200 would be a green
      # tick that certifies Cloudflare's login page and nothing else.
      #
      # What it can still prove is the opposite, and that one is worth having:
      # an anonymous 200 means nothing is gating the site. The mock data
      # carries real customer names, so that fails the job. Anything else is
      # logged and moves on -- a broken deploy on a mockup lab costs someone a
      # refresh, and `wrangler rollback` is one command against a version list
      # Cloudflare keeps forever. Reverting a good deploy automatically, which
      # is what the old smoke check did when it could not parse its own input,
      # costs more than it ever saved.
      - name: Check the site is still gated
        env:
          # Set here, not read from the deploy step: wrangler-action reports a
          # custom domain as "design.sarj.ai (custom domain)", prose and all,
          # which is not a URL and which curl rejects outright.
          URL: https://design.sarj.ai
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)"
          case "$code" in
            2*)
              echo "::error::$URL answered $code to an anonymous request -- the Access gate is off and the site is public."
              exit 1 ;;
            3*|401|403)
              echo "$URL -> $code, gated as expected." ;;
            *)
              echo "::warning::$URL -> $code. Not gated, not reachable either; worth a look, but not a reason to fail a deploy that uploaded fine." ;;
          esac
