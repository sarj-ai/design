# Push to main -> live on Cloudflare Workers.
#
# Needs two repository secrets, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Workers & Pages -> Account ID
#
# Everything else — the worker name, the bindings, the compat flags — is in
# wrangler.jsonc, so a deploy never depends on dashboard state someone has to
# remember to keep in step.
name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# Finish each active deployment and its Access check before another can start.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Before the build, not after: a missing credential should cost ten
      # seconds, not the two minutes it takes to get to the Deploy step. A
      # secret can exist and still hold an empty string, and wrangler's
      # "token not set" error reads identically either way.
      - name: Check the Cloudflare credentials are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/check-cloudflare-credentials.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 26.12.1
          cache: npm

      - name: Restore Next.js compiler state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache/turbopack
            tsconfig.tsbuildinfo
          key: next-compiler-v4-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'patches/**', 'src/**/*.css', 'src/**/*.scss', 'src/**/*.sass', 'public/**/*.css', '*.css', '*.scss', '*.sass') }}-${{ github.sha }}
          restore-keys: next-compiler-v4-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'patches/**', 'src/**/*.css', 'src/**/*.scss', 'src/**/*.sass', 'public/**/*.css', '*.css', '*.scss', '*.sass') }}-

      - name: Install the pinned npm release
        run: npm install --global npm@12.2.1

      - run: npm ci

      # The same gates that guard a local commit, so a red build never ships.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Install the pinned standards CLI
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/4ecd0eff2a81e3ffdcd7cfee10d08936e4747c17/crates/uv-python-managed/download-metadata.json
        run: uv tool install code-standards==9.4.9 --python 3.15.0
      - name: Install the pinned native tool bootstrap
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/4ecd0eff2a81e3ffdcd7cfee10d08936e4747c17/crates/uv-python-managed/download-metadata.json
        run: uv run --no-config --no-project --python 3.15.0 --with code-standards==9.4.9 python -m sarj_standards.libs.adoption.native_bootstrap
      - name: Install and attest applicable native tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: code-standards setup --tools-only
      - run: npm run lint
        env:
          SARJ_STANDARDS_BASE: >-
            ${{ !(github.event_name == 'push' && github.event.created &&
            github.event.before == '0000000000000000000000000000000000000000') &&
            (github.event.pull_request.base.sha || github.event.before) || '' }}
      - run: npm run test:rules
      - run: npm run typecheck

      - name: Build for Workers
        run: npm run cf:build

      - name: Smoke test the built Worker
        run: npm run cf:smoke

      - name: Require the current main revision before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-current-main-revision.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        # The `with:` inputs above are not enough. The action detects OpenNext
        # and calls `opennextjs-cloudflare deploy`, which spawns wrangler as a
        # nested subprocess -- and that subprocess reads the environment, not
        # the action's inputs. Without these two, wrangler falls back to
        # interactive OAuth and dies with "necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable".
        # cloudflare/wrangler-action#246, opennextjs/opennextjs-cloudflare#910.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare Access sits in front of design.sarj.ai and answers at the
      # edge, before the Worker runs. So a probe from here cannot prove the app
      # is healthy -- Access redirects identically whether the Worker serves
      # pages or throws on every request. Checking for a 200 would be a green
      # tick that certifies Cloudflare's login page and nothing else.
      #
      # What it can still prove is the opposite, and that one is worth having:
      # an anonymous 200 means nothing is gating the site. The mock data
      # carries real customer names, so that fails the job. Anything else is
      # logged and moves on -- a broken deploy on a mockup lab costs someone a
      # refresh, and `wrangler rollback` is one command against a version list
      # Cloudflare keeps forever. Reverting a good deploy automatically, which
      # is what the old smoke check did when it could not parse its own input,
      # costs more than it ever saved.
      - name: Check the site is still gated
        env:
          # Set here, not read from the deploy step: wrangler-action reports a
          # custom domain as "design.sarj.ai (custom domain)", prose and all,
          # which is not a URL and which curl rejects outright.
          URL: https://design.sarj.ai
        run: bash scripts/check-site-access.sh

      - name: Verify deployed Worker security
        run: |
          node .github/scripts/verify-worker-security.mjs design-lab
          node .github/scripts/verify-preview-access.mjs --active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
