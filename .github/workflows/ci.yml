# The gate on every pull request.
#
# Two jobs, and their names are load-bearing: `verify` and `dependency-review`
# are required status checks on main, so renaming a job here silently blocks
# every future merge until someone edits the branch rule to match.
#
# Deploying is deploy.yml's job. This one only ever says yes or no.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes one still running. On main every commit is kept —
# a cancelled run there would leave a merged commit with no verdict on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes. A token left on disk is one a later step,
          # or a dependency's install script, could reach.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches deploy.yml. The build that gates a merge and the build
          # that ships should not be on different runtimes.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The same three gates AGENTS.md puts before a commit, in the same
      # order: lint is the design system, typecheck is the types, and the
      # build is the only one that catches a route that cannot render.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  dependency-review:
    # Nothing to compare on a push — the action diffs a pull request's
    # manifests against its base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
