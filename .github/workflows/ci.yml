# The gate on every pull request.
#
# Two jobs, and their names are load-bearing: `verify` and `dependency-review`
# are required status checks on main, so renaming a job here silently blocks
# every future merge until someone edits the branch rule to match.
#
# Deploying is deploy.yml's job. This one only ever says yes or no.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes one still running. On main every commit is kept —
# a cancelled run there would leave a merged commit with no verdict on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. A token left on disk is one a later step,
          # or a dependency's install script, could reach.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          # Matches deploy.yml. The build that gates a merge and the build
          # that ships should not be on different runtimes.
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: package-lock.json

      # Stylesheet edits need a cold cache until vercel/next.js#100326 is fixed.
      - name: Cache Next.js compiler state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache/turbopack
            tsconfig.tsbuildinfo
          key: next-compiler-v4-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'patches/**', 'src/**/*.css', 'src/**/*.scss', 'src/**/*.sass', 'public/**/*.css', '*.css', '*.scss', '*.sass') }}-${{ github.sha }}
          restore-keys: next-compiler-v4-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'patches/**', 'src/**/*.css', 'src/**/*.scss', 'src/**/*.sass', 'public/**/*.css', '*.css', '*.scss', '*.sass') }}-

      - name: Install the pinned npm release
        run: npm install --global npm@12.2.1

      - run: npm ci
      - name: Audit the complete dependency graph for critical vulnerabilities
        run: npm audit --audit-level=critical
      - name: Verify the braces security backport
        run: npm run test:security

      # The Workers build includes next build. Exercise its output too: a
      # successful Next.js build does not prove the adapter can serve requests.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run cf:build
      - run: npm run cf:smoke

  dependency-review:
    # Nothing to compare on a push — the action diffs a pull request's
    # manifests against its base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
